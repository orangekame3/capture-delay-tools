[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capture-delay-tools"
version = "0.1.0"
description = "QuEL-1 capture delay sweeps and time-of-flight analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "qubex[backend] @ git+https://github.com/orangekame3/qubex.git@aed7308abd7843d35095c1b87697daa0a2380b48",
    "sqe-analysis",
    "numpy",
    "pandas",
    "pyyaml>=6",
    "ruamel.yaml>=0.18,<0.19",
    "plotly<6",
    "xarray",
]

[dependency-groups]
dev = ["pytest", "ruff", "pyright", "ipykernel"]

[tool.setuptools.packages.find]
include = ["capture_delay_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
extend-exclude = ["archive", "artifacts", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["capture_delay_tools", "tests"]
typeCheckingMode = "basic"

[tool.uv.sources]
sqe-analysis = { git = "https://github.com/RIKEN-SQERT/sqe-analysis", rev = "e2806e78c6155dfd107a2983d380a20a685c6266" }
